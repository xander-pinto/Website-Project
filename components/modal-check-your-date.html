<!--
  Shared "Check your date" modal. Loaded into every page by js/main.js.
  Submits via Netlify Forms. Form name: "check-your-date".
  EDIT: Add or remove event types in the <select> below.
-->
<div class="modal" id="check-your-date-modal" role="dialog" aria-modal="true" aria-labelledby="cyd-title" hidden>
  <div class="modal-backdrop" data-close-modal="true"></div>
  <div class="modal-panel">

    <button type="button" class="modal-close" aria-label="Close" data-close-modal="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>

    <h2 id="cyd-title">Check your date.</h2>
    <p class="lead">Tell us a little about your event. We'll confirm availability and come back with options that fit your night, within one business day.</p>

    <form name="check-your-date" method="POST" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="check-your-date">
      <p style="display:none;"><label>Don't fill this out: <input name="bot-field"></label></p>

      <div class="field">
        <label for="cyd-name">Your name</label>
        <input type="text" id="cyd-name" name="name" required autocomplete="name">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="cyd-email">Email</label>
          <input type="email" id="cyd-email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="cyd-phone">Phone</label>
          <input type="tel" id="cyd-phone" name="phone" autocomplete="tel">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="cyd-date">Event date</label>
          <input type="date" id="cyd-date" name="event_date">
          <label class="field-checkbox">
            <input type="checkbox" id="cyd-no-date" name="no_date_yet" value="yes">
            <span>I don't know my date yet</span>
          </label>
        </div>
        <div class="field">
          <label for="cyd-type">Event type</label>
          <!-- EDIT: Event types -->
          <select id="cyd-type" name="event_type" required>
            <option value="">Choose one</option>
            <option>Wedding</option>
            <option>Sweet 16</option>
            <option>Bar / Bat Mitzvah</option>
            <option>Quinceañera</option>
            <option>Corporate event</option>
            <option>Private party</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="cyd-venue">Venue or town (optional)</label>
        <input type="text" id="cyd-venue" name="venue">
      </div>

      <div class="field">
        <label for="cyd-referral">How did you hear about us?</label>
        <!-- EDIT: Referral sources — keep these in sync with the contact-page form. -->
        <select id="cyd-referral" name="referral_source" required>
          <option value="">Choose one</option>
          <option>Google search</option>
          <option>The Knot</option>
          <option>WeddingWire</option>
          <option>Zola</option>
          <option>Instagram or Facebook</option>
          <option>Friend or family</option>
          <option>Our venue recommended us</option>
          <option>Bridal show or showcase</option>
          <option>Booked us before</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Shown only when "Other" is selected (toggled by setupReferralOther in main.js). -->
      <div class="field" data-referral-other hidden>
        <label for="cyd-referral-other">Where did you hear about us?</label>
        <input type="text" id="cyd-referral-other" name="referral_other" placeholder="Tell us where you heard about us">
      </div>

      <div class="field">
        <label for="cyd-notes">Anything else?</label>
        <textarea id="cyd-notes" name="notes" placeholder="Guest count, vibe, questions, anything helps."></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send it</button>
      <p class="form-fineprint">We respond within one business day. Or call us at 631-732-5886.</p>
    </form>

  </div>
</div>
